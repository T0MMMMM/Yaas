# Packaging — see docs/ARCHITECTURE.md §1. Unsigned for now (personal project).
appId: dev.bigbrowser.app
productName: Big Browser
copyright: Copyright © 2026 Big Browser contributors

protocols:
  - name: Big Browser HTTP
    role: Viewer
    schemes:
      - http
      - https

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

# Native modules (node-pty, the Agent SDK's CLI binary) must live outside the asar.
asarUnpack:
  - '**/*.node'
  - 'node_modules/@anthropic-ai/claude-agent-sdk-*/**'

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  identity: null # no signing / notarization yet
  darkModeSupport: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

npmRebuild: true
